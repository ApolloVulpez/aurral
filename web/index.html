<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aurral</title>
    <meta
      name="description"
      content="Aurral is the Lidarr companion for self-hosted music discovery."
    />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      * {
        box-sizing: border-box;
      }

      body {
        background: #0a0c0c;
        color: #8e9489;
        margin: 0;
      }

      main {
        align-items: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 100svh;
        padding: clamp(1rem, 4vw, 3rem);
      }

      .terminal {
        border: 1px solid #394036;
        border-radius: 0.55rem;
        overflow: hidden;
        width: min(60rem, 100%);
      }

      .terminal-bar {
        align-items: center;
        display: grid;
        font-size: clamp(0.55rem, 1vw, 0.72rem);
        letter-spacing: 0.06em;
        min-height: 2.7rem;
        padding: 0 1rem;
      }

      .terminal-bar {
        border-bottom: 1px dashed #30372d;
        grid-template-columns: 1fr auto 1fr;
      }

      .terminal-controls {
        display: flex;
        gap: 0.55rem;
      }

      .terminal-controls b {
        font-weight: 500;
      }

      .terminal-controls b:first-child {
        color: #ff6b64;
      }

      .terminal-controls b:nth-child(2) {
        color: #f2bd4b;
      }

      .terminal-controls b:last-child {
        color: #48ca65;
      }

      .terminal-title {
        color: #c9cec4;
      }

      .stage {
        align-items: center;
        aspect-ratio: 16 / 9;
        display: flex;
        justify-content: center;
        overflow: hidden;
      }

      .ascii-stack {
        display: grid;
      }

      pre {
        flex: 0 0 auto;
        font:
          600 clamp(3.5px, 0.9vw, 12px) / 0.88 ui-monospace,
          SFMono-Regular,
          Menlo,
          Monaco,
          Consolas,
          monospace;
        grid-area: 1 / 1;
        margin: 0;
        user-select: none;
      }

      .ascii-base {
        color: #65a30d;
      }

      .ascii-highlight {
        color: #a3e635;
      }

      nav {
        display: flex;
        gap: clamp(0.8rem, 2vw, 1.5rem);
      }

      a {
        color: #84cc16;
        text-decoration-color: transparent;
        text-underline-offset: 0.3em;
      }

      a:hover,
      a:focus-visible {
        color: #b5ec5a;
        text-decoration-color: currentColor;
      }

      .tagline {
        font-family: system-ui, sans-serif;
        font-size: clamp(0.8rem, 1.2vw, 1rem);
        margin: clamp(1.25rem, 3vw, 2rem) 0 0;
        text-align: center;
      }

      .actions {
        justify-content: center;
        margin-top: 1rem;
      }

      .button {
        border: 1px solid #46503f;
        border-radius: 0.25rem;
        padding: 0.55rem 0.9rem;
        text-decoration: none;
      }

      .button:hover,
      .button:focus-visible {
        border-color: #84cc16;
      }

      @media (max-width: 520px) {
        main {
          justify-content: flex-start;
        }

        .terminal {
          border-radius: 0.4rem;
        }

        .terminal-bar {
          min-height: 2.3rem;
          padding-inline: 0.65rem;
        }

        .terminal-bar {
          grid-template-columns: 1fr auto;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="terminal" aria-label="Aurral terminal">
        <header class="terminal-bar">
          <span class="terminal-controls" aria-hidden="true"> <b>[x]</b><b>[-]</b><b>[+]</b> </span>
          <span class="terminal-title">♫ aurral</span>
        </header>

        <div class="stage" role="img" aria-label="A rotating Aurral logo rendered as ASCII art">
          <div class="ascii-stack" aria-hidden="true">
            <pre class="ascii-base" data-ascii-base></pre>
            <pre class="ascii-highlight" data-ascii-highlight></pre>
          </div>
          <noscript>Aurral</noscript>
        </div>
      </section>

      <p class="tagline">The Lidarr companion for music discovery.</p>
      <nav class="actions" aria-label="Aurral links">
        <a class="button" href="https://github.com/lklynet/aurral">GitHub</a>
        <a class="button" href="https://docs.aurral.org/">Docs</a>
      </nav>
    </main>

    <script type="module">
      const base = document.querySelector("[data-ascii-base]");
      const highlight = document.querySelector("[data-ascii-highlight]");

      fetch("3dsvg-ascii.json")
        .then((response) => {
          if (!response.ok) throw new Error(`Animation failed to load: ${response.status}`);
          return response.json();
        })
        .then(({ fps, columns, frames, highlights }) => {
          base.style.width = `${columns}ch`;
          highlight.style.width = `${columns}ch`;
          base.textContent = frames[0];
          highlight.textContent = highlights[0];
          if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;

          let previous = -1;
          const animate = (time) => {
            const frame = Math.floor((time * fps) / 1000) % frames.length;
            if (frame !== previous) {
              base.textContent = frames[frame];
              highlight.textContent = highlights[frame];
              previous = frame;
            }
            requestAnimationFrame(animate);
          };
          requestAnimationFrame(animate);
        })
        .catch(() => {});
    </script>
  </body>
</html>
